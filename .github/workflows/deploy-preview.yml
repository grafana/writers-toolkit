name: deploy-preview

permissions: {}

on:
  workflow_call:
    inputs:
      image:
        default: grafana/docs-base:latest
        description: Container image to use for building the website.
        type: string
      # Legacy inputs
      # Don't forget to make `sources` required when you remove these.
      source_directory:
        default: docs/sources
        type: string
      website_directory:
        type: string
      relative_prefix:
        type: string
      index_file: # creates the necessary project _index.md file for versioned repos
        type: boolean
      # End legacy inputs
      sources:
        description: |
          sources is a JSON string describing multiple source mounts.

          It replaces the individual inputs used in the previous version of this action.

          The structure is an array of objects, each with the following keys:

          index_file:
            description: Path to index file used to redirect versioned projects. For example, "content/docs/mimir/_index.md".
            required: true
            type: string
          relative_prefix:
            description: The URL path prefix for the mount destination. For example, "/docs/mimir/latest/".
            required: true
            type: string
          repo:
            description: The Grafana repository name for the source files. For example, "mimir".
            required: true
            type: string
          source_directory:
            description: The path to the source files in the repository. For example, "docs/sources".
            required: true
            type: string
          website_directory:
            description: The path to mount the documentation in the website content structure. For example, "content/docs/mimir/latest".
            required: true
            type: string
          ref:
            description: Optional git ref to check out for this source. If omitted, the workflow checks out the caller PR branch.
            required: false
            type: string

          The following example mounts both the Mimir documentation and the mimir-distributed Helm chart documentation:

          [
            {
              "index_file": true,
              "relative_prefix": "/docs/mimir/latest/",
              "repo": "mimir",
              "source_directory": "docs/sources/mimir",
              "website_directory": "content/docs/mimir/latest"
            },
            {
              "index_file": true,
              "relative_prefix": "/docs/helm-charts/mimir-distributed/latest/",
              "repo": "mimir",
              "source_directory": "docs/sources/mimir-distributed",
              "website_directory": "content/docs/helm-charts/mimir-distributed/latest",
              "ref": "main"
            }
          ]
        type: string
      sha:
        required: true
        type: string
      toolkit_ref:
        description: Ref used to checkout writers-toolkit helper files (branch, tag, or SHA). Defaults to PR SHA when running in writers-toolkit, otherwise main.
        required: false
        default: ""
        type: string
      branch:
        required: true
        type: string
      event_number:
        required: true
        type: string
      repo:
        required: true
        type: string
      title:
        required: true
        type: string
      build_script:
        description: "Build script to run. Allowed values: build, build-interactive-tutorials. Defaults to build."
        type: string

env:
  CLOUD_RUN_REGION: us-south1
  SHA: ${{ inputs.sha }}
  BRANCH: ${{ inputs.branch }}
  EVENT_NUMBER: ${{ inputs.event_number }}
  TITLE: ${{ inputs.title }}
  REPO: ${{ inputs.repo }}
  SOURCE_DIRECTORY: ${{ inputs.source_directory }}
  WEBSITE_DIRECTORY: ${{ inputs.website_directory }}
  INDEX_FILE: ${{ inputs.index_file }}
  RELATIVE_PREFIX: ${{ inputs.relative_prefix }}
  IMAGE: ${{ inputs.image }}
  SOURCES: ${{ inputs.sources }}
  BUILD_SCRIPT: ${{ inputs.build_script }}
  LINK_CHECKER_IMAGE: us-docker.pkg.dev/grafanalabs-dev/docker-website-public-dev/link-checker:sha-278dd4c@sha256:e797c3d33fe4715184fac4e89a5b2e662e19d72b66c1261f16d76cecc9c4724e

concurrency:
  group: ${{ github.workflow }}-${{ inputs.repo }}-${{ inputs.title }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-website:
    outputs:
      preview_image: ${{ steps.preview-image.outputs.image }}
      relative_prefix: ${{ steps.preview-paths.outputs.relative_prefix != '' && steps.preview-paths.outputs.relative_prefix || env.RELATIVE_PREFIX }}
      sources: ${{ steps.preview-paths.outputs.sources != '' && steps.preview-paths.outputs.sources || env.SOURCES }}
      website_directory: ${{ steps.preview-paths.outputs.website_directory != '' && steps.preview-paths.outputs.website_directory || env.WEBSITE_DIRECTORY }}
    permissions:
      contents: read # Clone repositories.
      id-token: write # Push the preview image to GAR.
      pull-requests: read # `gh pr checkout` in deploy-preview/build queries the pullRequests GraphQL API.
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: inputs.website_directory
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false # exclude root files
          sparse-checkout: docs

      - name: Sparse checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: grafana/writers-toolkit
          ref: ${{ inputs.toolkit_ref != '' && inputs.toolkit_ref || (github.repository == 'grafana/writers-toolkit' && inputs.sha || 'main') }}
          path: deploy-preview-files
          persist-credentials: false
          sparse-checkout: |
            deploy-preview

      - name: Download what's-new markdown from GCS
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/whats-new"
          gsutil -m rsync -r -d \
            gs://grafana-website-assets-public/deploy-preview/whats-new/ \
            "${RUNNER_TEMP}/whats-new/"
          echo "WHATS_NEW_DIR=${RUNNER_TEMP}/whats-new" >> "${GITHUB_ENV}"

      - name: Resolve preview paths
        id: preview-paths
        shell: bash
        env:
          BASE_SOURCES: ${{ inputs.sources }}
          TARGET_REF_NAME: ${{ github.event.pull_request.base.ref }}
        run: ./deploy-preview-files/deploy-preview/resolve-preview-paths

      - name: Keep only necessary files
        if: inputs.website_directory
        shell: bash
        env:
          SOURCE_DIRECTORY: ${{ inputs.source_directory }}
        run: |
          shopt -s extglob
          rm -rf !(docs|deploy-preview-files|.git)
          ls -al
          ls -al "${SOURCE_DIRECTORY}"
          ls -al deploy-preview-files

      # sparse checkout with cone mode disabled includes root files, even when using exclusions
      # see https://github.com/actions/checkout/issues/1430#issuecomment-1756326892
      - name: Keep only necessary files
        if: "!inputs.website_directory"
        shell: bash
        run: |
          shopt -s extglob
          rm -rf !(deploy-preview-files|.git)
          ls -al .
          ls -al deploy-preview-files

      - name: Build website
        shell: bash
        env:
          # Legacy input.
          SOURCE_DIRECTORY: ${{ env.SOURCE_DIRECTORY }}
          WEBSITE_DIRECTORY: ${{ steps.preview-paths.outputs.website_directory != '' && steps.preview-paths.outputs.website_directory || env.WEBSITE_DIRECTORY }}
          INDEX_FILE: ${{ env.INDEX_FILE }}
          REPO: ${{ env.REPO }}
          RELATIVE_PREFIX: ${{ steps.preview-paths.outputs.relative_prefix != '' && steps.preview-paths.outputs.relative_prefix || env.RELATIVE_PREFIX }}
          # End legacy input.
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.IMAGE }}
          SOURCES: ${{ steps.preview-paths.outputs.sources != '' && steps.preview-paths.outputs.sources || env.SOURCES }}
          BRANCH: ${{ env.BRANCH }}
        run: |
          script="${BUILD_SCRIPT:-build}"
          case "${script}" in
            build | build-interactive-tutorials) ;;
            *) echo "build_script must be one of: build, build-interactive-tutorials"; exit 1 ;;
          esac
          "./deploy-preview-files/deploy-preview/${script}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: deploy-preview-files/deploy-preview/remove-invalid-paths/go.mod
          cache: false # The tool has no module dependencies, so there is nothing to cache.

      - name: Remove files with invalid artifact paths
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${GITHUB_WORKSPACE}/dist"
          ( cd deploy-preview-files/deploy-preview/remove-invalid-paths && go run . -dist "${GITHUB_WORKSPACE}/dist" )

      - name: Generate deploy preview redirects
        shell: bash
        run: |
          ( cd deploy-preview-files/deploy-preview/redirects && go run . \
            -manifest "${GITHUB_WORKSPACE}/dist/redirects.txt" \
            -output "${GITHUB_WORKSPACE}/dist/redirects.conf" )

      - name: Generate build header
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
        run: printf "%s" "add_header 'Build' '${SHA}';" > build.conf

      - name: Authenticate to GAR for deploy previews
        id: gcloud-auth-preview-image
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-docs-deploy-previews@grafanalabs-workload-identity.iam.gserviceaccount.com
          create_credentials_file: false

      - name: Log in to GAR for deploy previews
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcloud-auth-preview-image.outputs.access_token }}

      - name: Extract preview image metadata
        id: preview-image-metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: us-docker.pkg.dev/grafanalabs-dev/docker-docs-previews-dev/${{ env.REPO }}
          tags: |
            ${{ env.SHA }}
            ${{ env.EVENT_NUMBER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cache-binary: false
          driver: docker-container

      - name: Build and push preview image to GAR
        id: push-preview-image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./deploy-preview-files/deploy-preview/Dockerfile
          tags: ${{ steps.preview-image-metadata.outputs.tags }}
          push: true
          cache-from: ''
          cache-to: ''

      - name: Expose immutable preview image
        id: preview-image
        env:
          IMAGE: us-docker.pkg.dev/grafanalabs-dev/docker-docs-previews-dev/${{ env.REPO }}
          DIGEST: ${{ steps.push-preview-image.outputs.digest }}
        run: echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy-preview:
    permissions:
      contents: read # Clone repositories.
      id-token: write # Fetch Vault secrets.
      pull-requests: write # Create or update PR comments.
      statuses: write # Update GitHub status check with deploy preview link.
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'labeled'
    needs: build-website
    runs-on: ubuntu-latest
    outputs:
      preview-url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Find comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: fc
        with:
          issue-number: ${{ inputs.event_number }}
          comment-author: github-actions[bot]
          body-includes: Deploy preview available (${{ inputs.title }})

      - name: Update comment with in-progress deploy preview
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ inputs.event_number }}
          edit-mode: append
          append-separator: newline
          body: |
            :building_construction: Updating deploy preview...

      - name: Sparse checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: grafana/writers-toolkit
          ref: ${{ inputs.toolkit_ref != '' && inputs.toolkit_ref || (github.repository == 'grafana/writers-toolkit' && inputs.sha || 'main') }}
          path: deploy-preview-files
          persist-credentials: false
          sparse-checkout: |
            deploy-preview

      - name: Use resolved preview paths
        shell: bash
        env:
          RESOLVED_RELATIVE_PREFIX: ${{ needs.build-website.outputs.relative_prefix }}
          RESOLVED_SOURCES: ${{ needs.build-website.outputs.sources }}
        run: |
          if [[ -n "${RESOLVED_SOURCES}" ]]; then
            echo "SOURCES=${RESOLVED_SOURCES}" >> "$GITHUB_ENV"
          fi

          if [[ -n "${RESOLVED_RELATIVE_PREFIX}" ]]; then
            echo "RELATIVE_PREFIX=${RESOLVED_RELATIVE_PREFIX}" >> "$GITHUB_ENV"
          fi

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: gcloud-auth-cloud-run
        with:
          workload_identity_provider: projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-docs-cloud-run-dev@grafanalabs-workload-identity.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'labeled'
        id: deploy
        with:
          image: ${{ needs.build-website.outputs.preview_image }}
          service: deploy-preview-${{ env.REPO }}-${{ env.EVENT_NUMBER }}
          project_id: grafanalabs-dev
          region: ${{ env.CLOUD_RUN_REGION }}
          flags: --port=80 --ingress=all --allow-unauthenticated

      - name: Send commit status
        uses: ouzi-dev/commit-status-updater@26588d166ff273fc4c0664517359948f7cdc9bf1 # v2.0.2
        if: inputs.website_directory
        with:
          name: deploy_preview
          status: ${{ job.status }}
          url: ${{ steps.deploy.outputs.url }}${{ env.RELATIVE_PREFIX }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: github.event.action == 'closed'

      - name: Send commit status
        uses: ouzi-dev/commit-status-updater@26588d166ff273fc4c0664517359948f7cdc9bf1 # v2.0.2
        if: "!env.WEBSITE_DIRECTORY && env.SOURCES && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'labeled')"
        with:
          name: deploy_preview
          status: ${{ job.status }}
          url: ${{ steps.deploy.outputs.url }}${{ (fromJSON(env.SOURCES))[0].relative_prefix }}
          description: Public deploy preview

      - name: Get preview URLs
        id: urls
        if: "!inputs.website_directory"
        shell: bash
        env:
          SOURCES: ${{ env.SOURCES }}
          URL: ${{ steps.deploy.outputs.url }}
        run: ./deploy-preview-files/deploy-preview/urls

      - name: Create comment with available deploy preview
        if: inputs.website_directory && steps.fc.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ env.EVENT_NUMBER }}
          body: |
            :computer: Deploy preview available (${{ inputs.title }}): ${{ steps.deploy.outputs.url }}${{ env.RELATIVE_PREFIX }}

      - name: Create comment with available deploy preview
        if: "!inputs.website_directory && steps.fc.outputs.comment-id == ''"
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ inputs.event_number }}
          body: |
            :computer: Deploy preview available (${{ inputs.title }}):
            ${{ steps.urls.outputs.urls }}

      - name: Update comment with available deploy preview
        if: inputs.website_directory && steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ env.EVENT_NUMBER }}
          edit-mode: replace
          body: |
            :computer: Deploy preview available (${{ inputs.title }}): ${{ steps.deploy.outputs.url }}${{ env.RELATIVE_PREFIX }}

      - name: Update comment with available deploy preview
        if: "!inputs.website_directory && steps.fc.outputs.comment-id != ''"
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ env.EVENT_NUMBER }}
          edit-mode: replace
          body: |
            :computer: Deploy preview available (${{ inputs.title }}):
            ${{ steps.urls.outputs.urls }}

  check-links:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'labeled'
    needs: [build-website, deploy-preview]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.sha }}
          path: source-files
          persist-credentials: false
          fetch-depth: 1

      - name: Check out deploy preview helpers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: grafana/writers-toolkit
          ref: ${{ inputs.toolkit_ref != '' && inputs.toolkit_ref || (github.repository == 'grafana/writers-toolkit' && inputs.sha || 'main') }}
          path: deploy-preview-files
          persist-credentials: false
          sparse-checkout: |
            deploy-preview

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Use resolved preview paths
        shell: bash
        env:
          RESOLVED_RELATIVE_PREFIX: ${{ needs.build-website.outputs.relative_prefix }}
          RESOLVED_SOURCES: ${{ needs.build-website.outputs.sources }}
        run: |
          if [[ -n "${RESOLVED_SOURCES}" ]]; then
            echo "SOURCES=${RESOLVED_SOURCES}" >> "$GITHUB_ENV"
          fi

          if [[ -n "${RESOLVED_RELATIVE_PREFIX}" ]]; then
            echo "RELATIVE_PREFIX=${RESOLVED_RELATIVE_PREFIX}" >> "$GITHUB_ENV"
          fi

      - name: Prepare source paths for comment lookup
        id: comment-source-paths
        shell: bash
        env:
          SOURCES: ${{ env.SOURCES }}
          SOURCE_DIRECTORY: ${{ env.SOURCE_DIRECTORY }}
        run: |
          if [[ -n "${SOURCES}" ]]; then
            mapped_sources="$(jq -c 'map(.source_directory |= if . == null or . == "" then . else "source-files/" + . end)' <<<"${SOURCES}")"
            printf 'sources=%s\n' "${mapped_sources}" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${SOURCE_DIRECTORY}" ]]; then
            printf 'source_directory=%s\n' "source-files/${SOURCE_DIRECTORY}" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to GAR for the preview image
        id: gcloud-auth-preview-check
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-docs-deploy-previews@grafanalabs-workload-identity.iam.gserviceaccount.com
          create_credentials_file: false

      - name: Log in to GAR for the preview image
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.gcloud-auth-preview-check.outputs.access_token }}

      - name: Pull the immutable preview image
        env:
          PREVIEW_IMAGE: ${{ needs.build-website.outputs.preview_image }}
        run: docker pull "${PREVIEW_IMAGE}"

      - name: Log in to production GAR for the link checker
        if: contains(env.LINK_CHECKER_IMAGE, 'grafanalabs-global')
        uses: grafana/shared-workflows/actions/login-to-gar@974c33049d0967c5c9cfc249fe675daf341dc78f # v0.4.0
        with:
          registry: us-docker.pkg.dev
          environment: prod

      - name: Pull the link checker image
        run: docker pull "${LINK_CHECKER_IMAGE}"

      - name: Determine changed files and compare complete front matter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.event_number }}
        run: |
          docker run --pull never --rm \
            -e GH_TOKEN \
            -e SOURCE_DIRECTORY \
            -e SOURCES \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/work/source-files \
            -v "${PWD}:/work" \
            -w /work \
            "${LINK_CHECKER_IMAGE}" \
            changes \
            -repo "$PR_REPO" \
            -pr-number "$PR_NUMBER" \
            -github-api-url "$GITHUB_API_URL" \
            -output changed-files.json \
            -repository-directory /work/source-files

      - name: Check links in the preview image
        shell: bash
        env:
          PREVIEW_IMAGE: ${{ needs.build-website.outputs.preview_image }}
        run: |
          ./deploy-preview-files/deploy-preview/check-links

      # Find any existing broken-links comment before generating the body so the
      # generator knows whether to emit a "resolved" body once all broken links
      # are fixed, and so the create/update steps can target the comment. This
      # must run unconditionally (regardless of whether the current build has
      # broken links) so that a comment showing the resolved state is still
      # updated when a later commit reintroduces broken links.
      - name: Find broken links comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: broken-links-comment
        with:
          issue-number: ${{ inputs.event_number }}
          comment-author: github-actions[bot]
          body-includes: <!-- broken-links-report:${{ inputs.repo }} -->

      - name: Generate broken links comment
        shell: bash
        env:
          SOURCES: ${{ steps.comment-source-paths.outputs.sources != '' && steps.comment-source-paths.outputs.sources || env.SOURCES }}
          SOURCE_DIRECTORY: ${{ steps.comment-source-paths.outputs.source_directory != '' && steps.comment-source-paths.outputs.source_directory || env.SOURCE_DIRECTORY }}
          RELATIVE_PREFIX: ${{ env.RELATIVE_PREFIX }}
          PR_REPO: ${{ inputs.repo }}
          PR_BRANCH: ${{ inputs.branch }}
          PR_TITLE: ${{ inputs.title }}
          PR_SHA: ${{ inputs.sha }}
          BROKEN_LINKS_COMMENT_EXISTS: ${{ steps.broken-links-comment.outputs.comment-id != '' }}
          PREVIEW_BASE_URL: ${{ needs.deploy-preview.outputs.preview-url }}
        run: |
          docker run --pull never --rm \
            -e BRANCH="${PR_BRANCH}" \
            -e RELATIVE_PREFIX \
            -e SOURCE_DIRECTORY \
            -e SOURCES \
            -e BROKEN_LINKS_COMMENT_EXISTS \
            -v "${PWD}:/work" \
            -w /work \
            "${LINK_CHECKER_IMAGE}" \
            comment \
            -links links.json \
            -changed-files-json changed-files.json \
            -output broken-links-comment.md \
            -repo "${PR_REPO}" \
            -branch "${PR_BRANCH}" \
            -commit "${PR_SHA}" \
            -title "${PR_TITLE}" \
            -base-url "${PREVIEW_BASE_URL}"

      - name: Print broken links comment
        run: cat broken-links-comment.md

      # The comment body is empty when there are no broken links in files
      # changed in this PR. In that case we skip commenting on the PR entirely.
      - name: Check for broken links comment
        id: broken-links-comment-body
        shell: bash
        run: |
          if [ -s broken-links-comment.md ]; then
            echo "has-content=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has-content=false" >> "${GITHUB_OUTPUT}"
          fi
          if grep -Fq "This PR introduces the following broken links" broken-links-comment.md; then
            echo "has-broken-links=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has-broken-links=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create broken links comment
        if: steps.broken-links-comment-body.outputs.has-content == 'true' && steps.broken-links-comment.outputs.comment-id == ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ inputs.event_number }}
          body-path: broken-links-comment.md

      - name: Update broken links comment
        if: steps.broken-links-comment-body.outputs.has-content == 'true' && steps.broken-links-comment.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.broken-links-comment.outputs.comment-id }}
          issue-number: ${{ inputs.event_number }}
          edit-mode: replace
          body-path: broken-links-comment.md

      - name: Fail when broken links are found
        if: steps.broken-links-comment-body.outputs.has-broken-links == 'true'
        shell: bash
        run: |
          echo "Broken links were introduced by this PR." >&2
          exit 1

  cleanup-preview:
    permissions:
      id-token: write
      pull-requests: write
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Find comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: fc
        with:
          issue-number: ${{ inputs.event_number }}
          comment-author: github-actions[bot]
          body-includes: Deploy preview available (${{ inputs.title }})

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        id: gcloud-auth-cloud-run
        with:
          workload_identity_provider: projects/304398677251/locations/global/workloadIdentityPools/github/providers/github-provider
          service_account: github-docs-cloud-run-dev@grafanalabs-workload-identity.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: grafanalabs-dev

      - name: Delete deploy preview
        env:
          REPO: ${{ inputs.repo }}
          EVENT_NUMBER: ${{ inputs.event_number }}
        run: |
          SERVICE_NAME="deploy-preview-${REPO}-${EVENT_NUMBER}"
          if gcloud run services describe "$SERVICE_NAME" --region="$CLOUD_RUN_REGION" --project=grafanalabs-dev > /dev/null 2>&1; then
            gcloud run services delete "$SERVICE_NAME" --region="$CLOUD_RUN_REGION" --project=grafanalabs-dev --quiet
          else
            echo "Service $SERVICE_NAME does not exist. Skipping step."
          fi

      - name: Update comment with deleted deploy preview
        if: steps.fc.outputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ env.EVENT_NUMBER }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          edit-mode: replace
          body: |
            :computer: Deploy preview deleted (${{ inputs.title }}).
